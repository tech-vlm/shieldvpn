name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-scripts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck (errors only)
        uses: ludeeus/action-shellcheck@master
        with:
          severity: error
          ignore_paths: vpn/wireguard

  validate-configs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate JSON configs
        run: |
          sudo apt-get update && sudo apt-get install -y jq
          find . -name '*.json' -not -path './node_modules/*' -not -path './dashboard/node_modules/*' -exec jq empty {} +

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build dashboard image
        run: docker build -t shieldvpn-dashboard:ci ./dashboard
