name: Dashboard CI/CD

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]
  pull_request:
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]

jobs:
  build:
    name: Build & Typecheck dashboard
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: dashboard/.nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 7

  deploy-netlify:
    name: Deploy to Netlify (REST API)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: dashboard/.nvmrc

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Zip dist
        working-directory: dashboard/dist
        run: zip -r ../deploy.zip .

      - name: Verify token & site access
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -e
          USER_EMAIL=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" https://api.netlify.com/api/v1/user | jq -r .email)
          if [ -z "$USER_EMAIL" ] || [ "$USER_EMAIL" = "null" ]; then
            echo "::error::Token is INVALID or expired. Generate a new one at app.netlify.com/user/applications"
            exit 1
          fi
          echo "[✔] Token belongs to: $USER_EMAIL"
          SITE_JSON=$(curl -s -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID")
          SITE_NAME=$(echo "$SITE_JSON" | jq -r '.name // empty')
          if [ -z "$SITE_NAME" ]; then
            echo "::error::Site not found. Full API response (check if site belongs to the same account):"
            echo "$SITE_JSON" | jq . || echo "$SITE_JSON"
            exit 1
          fi
          SITE_URL=$(echo "$SITE_JSON" | jq -r '.ssl_url // .url')
          echo "[✔] Site found: $SITE_NAME — $SITE_URL"
          echo "SITE_NAME=$SITE_NAME" >> $GITHUB_ENV
          echo "SITE_URL=$SITE_URL" >> $GITHUB_ENV

      - name: Deploy via Netlify API
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          set -e
          echo "[*] Uploading build to Netlify..."
          HTTP_CODE=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @dashboard/deploy.zip \
            "https://api.netlify.com/api/v1/sites/$NETLIFY_SITE_ID/deploys")
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "201" ]; then
            echo "::error::Deploy rejected (HTTP $HTTP_CODE). Full Netlify response:"
            cat response.json | jq . || cat response.json
            exit 1
          fi
          DEPLOY_URL=$(jq -r '.ssl_url // .url' response.json)
          echo "[✔] Deploy accepted! Live at: $DEPLOY_URL"
          echo "DEPLOY_URL=$DEPLOY_URL" >> $GITHUB_ENV

      - name: Deployment summary
        if: always()
        run: |
          echo "### 🛡️ ShieldVPN Console" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ env.DEPLOY_URL }}" ]; then
            echo "🚀 Live: ${{ env.DEPLOY_URL }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "Site: ${{ env.SITE_NAME }} (${{ env.SITE_URL }})" >> $GITHUB_STEP_SUMMARY
