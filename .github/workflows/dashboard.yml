name: Dashboard CI/CD

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]
  pull_request:
    paths: ["dashboard/**", ".github/workflows/dashboard.yml"]

jobs:
  build:
    name: Build & Typecheck dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npx --no-install tsc --noEmit

      - name: Build
        run: npm run build

      - name: Upload build artifact
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-dist
          path: dashboard/dist
          retention-days: 7

  deploy-netlify:
    name: Deploy to Netlify
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: dashboard/.nvmrc

      - name: Build dashboard
        working-directory: dashboard
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Deploy to Netlify
        working-directory: dashboard
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: npx --yes netlify-cli deploy --dir=dist --prod --message "Deploy ${{ github.sha }}"

      - name: Deployment summary
        if: always()
        run: |
          echo "### 🛡️ ShieldVPN Console" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Netlify site: ${{ secrets.NETLIFY_SITE_ID }}" >> $GITHUB_STEP_SUMMARY
